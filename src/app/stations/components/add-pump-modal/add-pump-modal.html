@if (store.isAddPumpModalOpen()) {
  <div class="um-modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-labelledby="add-pump-title">
    <div class="um-modal">
      <div class="um-modal-header">
        <div class="um-modal-title-group">
          <div class="um-modal-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
          </div>
          <div>
            <h2 id="add-pump-title" class="um-modal-title">Add pump</h2>
            <p class="um-modal-subtitle">Each pump dispenses exactly one product</p>
          </div>
        </div>
        <button type="button" class="um-modal-close" (click)="onClose()" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <form class="um-modal-form" (submit)="onSubmit($event)" novalidate>
        @if (store.saveErrorMessage()) {
          <div class="um-form-alert alert-error" role="alert">{{ store.saveErrorMessage() }}</div>
        }

        <div class="um-form-group">
          <label class="um-form-label" for="pump-name">Pump name</label>
          <div class="um-input-wrap">
            <input id="pump-name" type="text" class="um-form-input um-form-input--plain" [class.is-invalid]="nameError()" [value]="name()" (input)="setName($event)" maxlength="40" autocomplete="off" [disabled]="isSubmitting()" required />
          </div>
          @if (nameError()) { <span class="um-form-error">{{ nameError() }}</span> }
        </div>

        <div class="um-form-group">
          <span class="um-form-label">Product</span>
          <div class="um-role-grid um-role-grid--three">
            @for (p of products; track p) {
              <label class="um-role-option" [class.selected]="product() === p" [attr.data-product]="p">
                <input type="radio" name="pump-product" [value]="p" [checked]="product() === p" (change)="setProduct($event)" [disabled]="isSubmitting()" />
                <div class="um-role-dot" [attr.data-product]="p"></div>
                <div class="um-role-label-group"><span class="um-role-name">{{ label(p) }}</span></div>
              </label>
            }
          </div>
        </div>

        <div class="um-form-group">
          <label class="ap-toggle">
            <input type="checkbox" [checked]="status() === 'active'" (change)="setStatus($event)" [disabled]="isSubmitting()" />
            <span>In service (readings required in the daily record)</span>
          </label>
        </div>

        <div class="um-modal-actions">
          <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isSubmitting()">Cancel</button>
          <button type="submit" class="btn btn-primary um-submit-btn" [disabled]="!isValid() || isSubmitting()" id="submit-add-pump-btn">
            @if (isSubmitting()) { <span class="btn-spinner"></span> Adding… } @else { Add pump }
          </button>
        </div>
      </form>
    </div>
  </div>
}
