<app-admin-navbar></app-admin-navbar>

<div class="admin-layout-container">
  <!-- Left Sidenav Sidebar -->
  <aside id="admin-sidebar" class="admin-sidebar" [class.collapsed]="!isSidebarOpen()">
    <nav class="sidebar-nav-group" aria-label="Admin navigation">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="sidebar-link" id="admin-nav-dashboard">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="sidebar-link" id="admin-nav-users">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>Users Management</span>
      </a>
      <a routerLink="/admin/managers" routerLinkActive="active" class="sidebar-link" id="admin-nav-managers">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span>Managers</span>
      </a>
      <a routerLink="/admin/stations" routerLinkActive="active" class="sidebar-link" id="admin-nav-stations">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.7l6 5.4V18h-4v-5H10v5H6v-6.9l6-5.4z"/>
        </svg>
        <span>Stations</span>
      </a>
      <a routerLink="/admin/tickets" routerLinkActive="active" class="sidebar-link" id="admin-nav-tickets">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v4c1.1 0 2 .9 2 2s-.9 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>
        </svg>
        <span>Support Tickets</span>
      </a>
    </nav>
  </aside>

  <!-- Main Viewport Area -->
  <main class="admin-main" [class.collapsed-sidebar]="!isSidebarOpen()">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
