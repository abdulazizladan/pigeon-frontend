<!-- Admin Top Navigation Bar -->
<header class="admin-navbar">
  <!-- Left: Hamburger toggle, Logo & Admin Badge -->
  <div class="nav-left">
    <button class="icon-btn sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    <a routerLink="/manager/my-station" class="logo-text">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 3.54 1.84 6.66 4.61 8.44L12 22l5.39-1.56A9.99 9.99 0 0 0 22 12c0-5.52-4.48-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
      pigeon <span class="admin-badge">Manager</span>
    </a>
  </div>

  <!-- Center: Title -->
  <div class="nav-center">
    <span class="portal-title">Station Console</span>
  </div>

  <!-- Right: Profile, Theme toggle, logout -->
  <div class="nav-right">
    <div class="profile-display">
      <div class="avatar admin-avatar-style">
        {{ userInitial() }}
      </div>
      <span class="profile-username">{{ currentUser()?.username }}</span>
    </div>

    <!-- Theme Toggle -->
    <button class="icon-btn theme-toggle" (click)="toggleTheme()" [title]="theme() === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode'">
      @if (theme() === 'light') {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-9 8.3-9.9.5-.1.9.3.8.8-.2.9-.3 1.8-.3 2.7 0 5.5 4.5 10 10 10 .9 0 1.8-.1 2.7-.3.5-.1 1 .3.8.8-.9 4.8-5.1 8.3-9.9 8.3z"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.01a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
      }
    </button>

    <!-- Logout -->
    <button class="icon-btn logout-btn" (click)="onLogout()" title="Log Out">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
      </svg>
    </button>
  </div>
</header>

<div class="admin-layout-container">
  <!-- Left Sidenav Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="!isSidebarOpen()">
    <nav class="sidebar-nav-group" aria-label="Manager navigation">
      <a routerLink="/manager/my-station" routerLinkActive="active" class="sidebar-link" id="manager-nav-my-station">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.7l6 5.4V18h-4v-5H10v5H6v-6.9l6-5.4z"/>
        </svg>
        <span>My Station</span>
      </a>
      <a routerLink="/manager/sales" routerLinkActive="active" class="sidebar-link" id="manager-nav-sales">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
        </svg>
        <span>Daily Sales</span>
      </a>
    </nav>
  </aside>

  <!-- Main Viewport Area -->
  <main class="admin-main" [class.collapsed-sidebar]="!isSidebarOpen()">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
