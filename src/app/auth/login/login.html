<div class="login-wrapper">
  <!-- Dynamic Theme Switcher floating in top-right -->
  <button class="theme-toggle-floating" (click)="toggleTheme()" [title]="theme() === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode'">
    @if (theme() === 'light') {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-9 8.3-9.9.5-.1.9.3.8.8-.2.9-.3 1.8-.3 2.7 0 5.5 4.5 10 10 10 .9 0 1.8-.1 2.7-.3.5-.1 1 .3.8.8-.9 4.8-5.1 8.3-9.9 8.3z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.01a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
      </svg>
    }
  </button>

  <div class="login-container">
    <!-- Left Column: Branding -->
    <div class="login-brand">
      <img src="img/logo.png" alt="Pigeon Logo" class="brand-logo" />
      <h1 class="brand-title">pigeon</h1>
      <p class="brand-subtitle">
        Pigeon helps you connect and share with the people in your life, securely and in real-time.
      </p>
    </div>

    <!-- Right Column: Login Card -->
    <div class="login-card-container">
      <div class="card login-card">
        <form (submit)="onLogin($event)">
          <!-- Error Display -->
          @if (validationError() || store.errorMessage()) {
            <div class="error-banner" role="alert">
              {{ validationError() || store.errorMessage() }}
            </div>
          }

          <div class="form-group">
            <input
              type="text"
              placeholder="Username"
              [value]="username()"
              (input)="updateField('username', $event)"
              class="login-input"
              required
              [disabled]="store.isLoading()"
              id="username-input"
            />
          </div>

          <div class="form-group">
            <input
              type="password"
              placeholder="Password"
              [value]="password()"
              (input)="updateField('password', $event)"
              class="login-input"
              required
              [disabled]="store.isLoading()"
              id="password-input"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-login-submit"
            [disabled]="store.isLoading()"
          >
            @if (store.isLoading()) {
              Logging in...
            } @else {
              Log In
            }
          </button>
        </form>

        <div class="login-divider"></div>

        <div style="text-align: center;">
          <button class="btn btn-create-account" type="button" disabled>
            Create New Account
          </button>
        </div>
      </div>

      @if (showSeedHint) {
        <p class="login-card-footer">
          <strong>Dev seed accounts:</strong>
          <code class="code-ref">admin</code>, <code class="code-ref">director</code>, <code class="code-ref">manager</code>
          &middot; password <code class="code-ref">password</code>
        </p>
      }
    </div>
  </div>
</div>
